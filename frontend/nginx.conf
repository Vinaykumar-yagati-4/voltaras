# ============================================================
# VOLTARAS Frontend — nginx static server
#
# Serves the built Vite app and proxies all /api traffic to the
# api-gateway container so the SPA works fully same-origin
# (no CORS needed). Browser refreshes on React Router routes
# fall back to index.html.
# ============================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Forward all API traffic to the API Gateway container. No URI rewrite:
  # the gateway expects the original "/api/..." path.
  location ^~ /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Vite emits content-hashed asset filenames, so long-lived caching is safe.
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: any route that is not a real file serves index.html so
  # React Router handles /consumer, /admin/prepare-consumer, etc. on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
