server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Auth Service
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            # User Service
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            # Meter Reading Service
            - id: meter-reading-service
              uri: lb://METER-READING-SERVICE
              predicates:
                - Path=/api/meter-readings/**

            # Organization Service
            - id: organization-service
              uri: lb://ORGANIZATION-SERVICE
              predicates:
                - Path=/api/organizations/**,/api/buildings/**,/api/blocks/**,/api/floors/**,/api/units/**,/api/admin/organizations/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always

    gateway:
      access: read-only

app:
  jwt:
    secret: ${JWT_SECRET:2A4B6D8F0C1E3G5H7I9K2M4N6P8Q0R2T4V6W8X0Y2Z4A6B8C0D2E4F6G8H0J}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.voltaras.apigateway: DEBUG