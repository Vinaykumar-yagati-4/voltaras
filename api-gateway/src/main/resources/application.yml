server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # Strips the Origin header before forwarding requests downstream so
          # services never see a browser Origin and cannot emit their own CORS
          # headers. Gateway CORS processing (CorsWebFilter) runs before this
          # gateway filter chain, so the CORS response headers are unaffected.
          default-filters:
            - RemoveRequestHeader=Origin

          globalcors:
            add-to-simple-url-handler-mapping: true

            cors-configurations:
              '[/**]':
                # Development policy: any localhost / 127.0.0.1 port.
                # Production origins are provided externally through the
                # CORS_ALLOWED_ORIGIN_PATTERNS environment variable.
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - "*"

                exposedHeaders:
                  - Authorization
                  - X-User-Id
                  - X-User-Role

                # Credentials are never combined with wildcard origins; the
                # JWT is carried in the Authorization header.
                allowCredentials: false
                maxAge: 3600

          routes:
            - id: auth-internal-users
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/internal/users/**

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: meter-reading-service
              uri: lb://METER-READING-SERVICE
              predicates:
                - Path=/api/meter-readings/**

            - id: organization-service
              uri: lb://ORGANIZATION-SERVICE
              predicates:
                - Path=/api/organizations/**,/api/buildings/**,/api/blocks/**,/api/floors/**,/api/units/**,/api/admin/organizations/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**,/api/recharges/**,/api/wallet/**,/api/wallets/**,/api/bills/*/payments/**

            - id: bill-service
              uri: lb://BILL-SERVICE
              predicates:
                - Path=/api/bills/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: complaint-service
              uri: lb://COMPLAINT-SERVICE
              predicates:
                - Path=/api/complaints/**,/api/admin/complaints/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always

    gateway:
      access: read-only

app:
  jwt:
    secret: ${JWT_SECRET:2A4B6D8F0C1E3G5H7I9K2M4N6P8Q0R2T4V6W8X0Y2Z4A6B8C0D2E4F6G8H0J}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.voltaras.apigateway: DEBUG