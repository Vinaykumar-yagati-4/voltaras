server:
  port: 8085

spring:
  application:
    name: organization-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:organization_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    web:
      pageable:

        # Used when the client does not provide the size parameter.
        default-page-size: ${DEFAULT_PAGE_SIZE:10}

        # Prevents clients from requesting excessively large pages.
        max-page-size: ${MAX_PAGE_SIZE:100}

        # Spring Data pagination starts from page 0.
        one-indexed-parameters: false

      sort:

        # Enables sorting using query parameters such as:
        # sort=createdAt,desc
        sort-parameter: sort

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    disable-swagger-default-url: true

    # Keeps the JWT authorization value during browser refreshes.
    persist-authorization: true

  show-actuator: false

logging:
  level:
    org.hibernate.SQL: ${LOG_HIBERNATE_SQL:WARN}
    com.voltaras.organizationservice: ${LOG_APP_LEVEL:INFO}