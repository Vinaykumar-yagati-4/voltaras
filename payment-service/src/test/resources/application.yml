server:
  port: 0

spring:
  application:
    name: payment-service

  datasource:
    # In-memory DB in MySQL mode so the tests run without a MySQL server.
    url: jdbc:h2:mem:paymentdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  bill-service:
    base-url: http://localhost:8084
  organization-service:
    base-url: http://localhost:8085
  razorpay:
    base-url: http://localhost:9999
    key-id: rzp_test_0000000000000000
    key-secret: test-key-secret
    webhook-secret: test-webhook-secret

logging:
  level:
    com.voltaras.paymentservice: DEBUG
