server:
  port: 0

spring:
  application:
    name: complaint-service

  datasource:
    # In-memory DB in MySQL mode so the tests run without a MySQL server.
    url: jdbc:h2:mem:complaintdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  rabbitmq:
    # No broker is needed for tests; the publisher never connects eagerly.
    host: localhost
    port: 5672

  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    com.voltaras.complaintservice: DEBUG
