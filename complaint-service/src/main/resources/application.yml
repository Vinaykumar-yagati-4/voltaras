server:
  port: 8087

spring:
  application:
    name: complaint-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:complaint_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    web:
      pageable:

        # Used when the client does not provide the size parameter.
        default-page-size: ${DEFAULT_PAGE_SIZE:10}

        # Prevents clients from requesting excessively large pages.
        max-page-size: ${MAX_PAGE_SIZE:100}

        # Spring Data pagination starts from page 0.
        one-indexed-parameters: false

      sort:

        # Enables sorting using query parameters such as:
        # sort=createdAt,desc
        sort-parameter: sort

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

springdoc:
  # Generates the OpenAPI JSON description.
  api-docs:
    enabled: true
    path: /v3/api-docs

  # Provides the browser-based Swagger testing interface.
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    # Display API operations in HTTP-method order.
    operations-sorter: method

    # Display controller groups alphabetically.
    tags-sorter: alpha

    # Keep each controller section closed when Swagger opens.
    doc-expansion: none

    # Do not show Swagger's default example server.
    disable-swagger-default-url: true

    # Keeps the JWT authorization value during browser refreshes.
    persist-authorization: true

  # Do not include Actuator endpoints in the application API documentation.
  show-actuator: false

logging:
  level:
    org.hibernate.SQL: ${LOG_HIBERNATE_SQL:WARN}
    com.voltaras.complaintservice: ${LOG_APP_LEVEL:INFO}
